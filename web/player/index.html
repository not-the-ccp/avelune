<!doctype html><meta charset="utf-8"><title>Avelune Draft Browser Player</title>
<style>body{font:14px system-ui;margin:2rem;background:#111;color:#eee}canvas{max-width:100%;background:#000}input[type=text]{width:28rem}button,input{margin:.25rem}.row{display:flex;gap:.5rem;align-items:center}#seek{width:min(50rem,80vw)}code{color:#9fd}</style>
<h1>Avelune browser POC</h1>
<p><a href="../docs/index.html">Back to Avelune docs</a> · <a href="https://github.com/not-the-ccp/avelune">Project repository</a></p>
<p>Custom Draft Generation 1 <code>ALV1</code> video + <code>ALA1</code> audio decoded in WebAssembly. The player fetches the front index and only the required epoch byte ranges. This is a reference/demo player, not a production-performance backend.</p>
<div class=row><input id=url type=text value="demo.avl"><button id=load>Load</button><button id=play disabled>Play / resume</button></div>
<canvas id=c width=640 height=360></canvas>
<div class=row><input id=seek type=range min=0 max=1 step=.001 value=0><span id=time>0.00s</span></div>
<pre id=status>idle</pre>
<script type=module src="player.js"></script>
