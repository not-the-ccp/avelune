name: Apply demo lab

on:
  push:
    branches: [chatgpt/major-demo-lab]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Assemble and apply locally tested patch
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/avelune-deploy/patch00 .github/avelune-deploy/patch01 > /tmp/avelune.patch.xz.b64
          echo '53f5641c89da7a77a6c7925fff8b7ccfe2e392447253166bd5a7055f4a174b69  /tmp/avelune.patch.xz.b64' | sha256sum -c -
          base64 -d /tmp/avelune.patch.xz.b64 | xz -dc > /tmp/avelune.patch
          git apply --index /tmp/avelune.patch

      - name: Install exact toolchain and web dependencies
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default 1.97.1
          npm ci
          python3 -c 'import PIL' || { sudo apt-get update; sudo apt-get install -y python3-pil; }
          ffmpeg -version >/dev/null || { sudo apt-get update; sudo apt-get install -y ffmpeg; }

      - name: Generate showcase and browser import fixtures
        shell: bash
        run: |
          set -euxo pipefail
          cargo build --release -p avelune-cli --locked
          python3 scripts/generate-showcase-media.py --cli target/release/avelune --out-dir web/player
          mkdir -p tests/browser
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc=size=96x54:rate=8' \
            -f lavfi -i 'sine=frequency=440:sample_rate=32000' \
            -t 1 -c:v libx264 -preset veryfast -pix_fmt yuv420p \
            -c:a aac -ac 2 -ar 32000 -shortest tests/browser/import-smoke.mp4
          target/release/avelune verify web/player/showcase-2d.avl
          target/release/avelune verify web/player/showcase-3d.avl
          target/release/avelune verify web/player/showcase-text.avl

      - name: Run complete development checks
        shell: bash
        run: |
          set -euxo pipefail
          if command -v google-chrome >/dev/null; then
            export CHROMIUM="$(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null; then
            export CHROMIUM="$(command -v google-chrome-stable)"
          elif command -v chromium >/dev/null; then
            export CHROMIUM="$(command -v chromium)"
          else
            echo 'No Chromium-family browser is installed on the runner' >&2
            exit 1
          fi
          echo "Browser smoke will use: $CHROMIUM"
          ./scripts/dev-check.sh

      - name: Commit verified final branch
        shell: bash
        run: |
          set -euxo pipefail
          git rm -f .github/workflows/apply-demo-lab.yml .github/avelune-deploy/patch00 .github/avelune-deploy/patch01
          rmdir .github/avelune-deploy || true
          git add -A
          git config user.name 'not-the-ccp'
          git config user.email '315506978+not-the-ccp@users.noreply.github.com'
          git commit -m 'Turn the browser demo into a real media lab'
          git push origin HEAD:chatgpt/major-demo-lab
