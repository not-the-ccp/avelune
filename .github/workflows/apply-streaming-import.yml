name: Apply streaming importer
on:
  push:
    branches: [chatgpt/streaming-import-ui]
permissions:
  contents: write
jobs:
  apply-test-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Apply exact tested patch
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/streaming-import-patch/part00 .github/streaming-import-patch/part01 .github/streaming-import-patch/part02 .github/streaming-import-patch/part03 > /tmp/streaming.patch.xz.b64
          base64 -d /tmp/streaming.patch.xz.b64 > /tmp/streaming.patch.xz
          echo 'e370f3153627e982f0e90c07646bb39ef0f8f3d7c7e0c932aa90bbb2f5f04413  /tmp/streaming.patch.xz' | sha256sum -c -
          xz -dc /tmp/streaming.patch.xz > /tmp/streaming.patch
          git apply --index /tmp/streaming.patch
      - name: Install toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default 1.97.1
          npm ci
      - name: Full development and browser checks
        run: ./scripts/dev-check.sh
      - name: Publish clean implementation branch
        shell: bash
        run: |
          set -euxo pipefail
          git rm -f .github/workflows/export-worktree.yml .github/workflows/apply-streaming-import.yml
          git rm -r -f .github/streaming-import-patch
          git add -A
          git config user.name 'not-the-ccp'
          git config user.email '315506978+not-the-ccp@users.noreply.github.com'
          git commit -m 'Stream browser media imports and fix converter layout'
          git push origin HEAD:chatgpt/streaming-import-ui
