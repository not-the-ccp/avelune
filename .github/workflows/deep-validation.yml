name: Draft codec validation
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 0'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.97.1
      - name: Check FFmpeg and Node
        run: ffmpeg -version | head -1 && node --version
      - name: Deep Draft Generation 1 validation
        run: ./scripts/validate-draft.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: draft-validation
          path: dist/
