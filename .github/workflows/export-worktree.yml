name: Export worktree
on:
  push:
    branches: [chatgpt/streaming-import-ui]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pack checkout
        run: tar --exclude=.git -czf /tmp/avelune-worktree.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: avelune-worktree
          path: /tmp/avelune-worktree.tar.gz
          retention-days: 1
