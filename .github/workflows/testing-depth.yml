name: Codec test depth
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 2'
    - cron: '41 3 * * 5'
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Stateful soak tests
        run: cargo test -p avelune --release --test soak -- --ignored --test-threads=1

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [entropy, video_decode, audio_decode, container_stream, structured_video]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly fuzz tooling
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Coverage-guided fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- -max_total_time=180 -timeout=10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}/

  sanitizer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly with rust-src
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: Sanitized canonical tests
        env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
          RUSTDOCFLAGS: -Zsanitizer=${{ matrix.sanitizer }}
        run: |
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu -p avelune-kernels -p avelune --release --tests --locked

  i686-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal --target i686-unknown-linux-gnu && rustup default 1.97.1
      - name: 32-bit portability compile gate
        run: cargo check -p avelune-kernels -p avelune --target i686-unknown-linux-gnu --locked

  coverage-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --locked
      - name: Coverage inventory (diagnostic, not a percentage gate)
        run: cargo llvm-cov -p avelune -p avelune-kernels --all-targets --lcov --output-path results/canonical.lcov --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-coverage
          path: results/canonical.lcov
