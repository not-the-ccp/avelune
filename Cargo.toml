[workspace]
resolver = "3"
members = [
  "crates/avelune",
  "crates/avelune-kernels",
  "crates/avelune-reference",
  "crates/avelune-wasm",
  "tools/avelune-cli",
  "tools/avelune-lab",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
